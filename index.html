<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BK Moto — Location de scooters à Tamraght & Taghazout</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7efe1;--card:#fffaf1;--fg:#10202f;--mut:#5e6b78;--line:#e4d6bd;--or:#ee7424;--nv:#0f2438;--tq:#12738b;--sea:#bfe3ea;--land:#f1dfbf;color-scheme:light dark;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c1624;--card:#122338;--fg:#f6ecdb;--mut:#a3b1c2;--line:#233650;--sea:#12384a;--land:#1c2c3f}}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:100px;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/1.6 'DM Sans',system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-weight:800;line-height:1;margin:0;letter-spacing:-.02em}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--or);outline-offset:3px}
.w{max-width:1160px;margin:0 auto;padding:0 5vw}
nav{position:fixed;z-index:20;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;max-width:1120px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px;border-radius:99px;background:rgba(15,36,56,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 40px rgba(8,18,32,.28);color:#fff}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--or);flex:none}
.brand b{font:800 19px/1 'Bricolage Grotesque',sans-serif;display:block}
.brand small{display:none;font-size:11px;color:#9fb0c6;margin-top:3px}
.lk{display:none;gap:4px;font-size:15px}
.lk a{padding:9px 16px;border-radius:99px;color:#d3dce6;transition:background .2s}
.lk a:hover{background:rgba(255,255,255,.12);color:#fff}
.nr{display:flex;align-items:center;gap:8px;flex:none}
.lang{display:flex;background:rgba(255,255,255,.12);border-radius:99px;padding:3px}
.lang button{background:none;border:0;padding:6px 10px;border-radius:99px;font-size:12px;font-weight:500;cursor:pointer;color:#c3cfdc}
.lang button.on{background:#fff;color:var(--nv)}
@media(min-width:900px){.lk{display:flex}.brand small{display:block}}
.btn{display:inline-block;background:var(--or);color:#1a1208;border:0;border-radius:99px;padding:14px 28px;font-weight:500;cursor:pointer;text-align:center;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn.sm{padding:9px 18px;font-size:14px}
.btn.ghost{background:none;color:var(--fg);border:1.5px solid var(--fg)}
.btn.wa{background:#1f9a56;color:#fff;display:block;width:100%}
.hero{padding:calc(112px + env(safe-area-inset-top,0px)) 0 70px;overflow:hidden}
.hero .w{display:grid;gap:40px;align-items:center}
.hero h1{font-size:clamp(54px,11vw,132px);line-height:.88}
.hero h1 span{display:block}
.hero h1 span:nth-child(2){color:var(--tq)}
.hero h1 span:nth-child(3){color:var(--or)}
.hero p{max-width:42ch;color:var(--mut);font-size:19px;margin:22px 0 28px}
.acts{display:flex;flex-wrap:wrap;gap:12px}
.vis{position:relative;max-width:460px;width:100%;justify-self:center}
.sun{position:absolute;width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#ffb347,var(--or));top:-6%;right:-14%}
.arch{position:relative;aspect-ratio:4/5;border-radius:999px 999px 30px 30px;overflow:hidden;border:6px solid var(--nv);background:var(--sea)}
.arch img{width:100%;height:100%;object-fit:cover;object-position:50% 72%;display:block}
.chip{position:absolute;background:var(--nv);color:#fff;border-radius:16px;padding:10px 16px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.chip b{display:block;font:800 22px 'Bricolage Grotesque',sans-serif;color:#ffb347}
.c1{left:2%;bottom:12%;transform:rotate(-4deg)}.c2{right:2%;bottom:-3%;transform:rotate(3deg)}
@media(min-width:900px){.hero .w{grid-template-columns:1.1fr .9fr}}
@media(max-width:899px){.lk{display:none}}
section{padding:90px 0}
.alt{background:var(--card)}
h2{font-size:clamp(36px,5.5vw,64px);margin-bottom:14px}
.lead{color:var(--mut);max-width:52ch;margin:0 0 40px}
.fleet{display:grid;gap:28px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.fc{position:relative;border-radius:30px;overflow:hidden;background:var(--nv);color:#fff;min-height:520px;display:flex;align-items:flex-end}
.fc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fc::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(15,36,56,.96) 88%)}
.fb{position:relative;z-index:1;padding:28px;display:grid;gap:12px;width:100%}
.fb h3{font-size:40px}.fb p{margin:0;color:#d3dce6}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:4px 14px;font-size:14px}
.bars{display:flex;align-items:flex-end;gap:14px;height:300px;max-width:760px}
.bar{flex:1;border-radius:22px 22px 6px 6px;padding:18px 14px;display:flex;flex-direction:column;justify-content:space-between;color:#10202f}
.bar small{font-size:14px;font-weight:500}
.bar b{font:800 clamp(40px,9vw,68px)/1 'Bricolage Grotesque',sans-serif}
.bar i{font-style:normal;font-size:13px;display:block}
.b1{height:100%;background:var(--or)}.b2{height:80%;background:#f6a55a}.b3{height:68%;background:var(--tq);color:#fff}
.ex{margin-top:22px;color:var(--mut)}
.two{display:grid;gap:50px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.ic{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin-top:8px}
.ic div{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 12px;text-align:center;font-weight:500}
.ic em{display:block;font-style:normal;font-size:30px;margin-bottom:6px}
ul{list-style:none;margin:0;padding:0}
li{padding:14px 0;border-bottom:1px solid var(--line)}
.steps{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));counter-reset:s}
.steps div{counter-increment:s;padding-top:18px;border-top:3px solid var(--or);font-size:19px;font-weight:500}
.steps div::before{content:counter(s);display:block;font:800 54px 'Bricolage Grotesque',sans-serif;color:var(--or);margin-bottom:6px}
.find{display:grid;gap:32px;align-items:center}
@media(min-width:900px){.find{grid-template-columns:1.2fr .8fr}}
.map{border-radius:30px;overflow:hidden;border:6px solid var(--nv);line-height:0}
.map svg{width:100%;height:auto}
.mt{fill:var(--fg);font:600 15px 'DM Sans',sans-serif}
.pulse{transform-origin:0 0;animation:p 2.4s ease-out infinite}
@keyframes p{0%{transform:scale(.4);opacity:.7}100%{transform:scale(2.2);opacity:0}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}.btn{transition:none}html{scroll-behavior:auto}}
.cap{color:var(--mut);font-size:13px;margin:10px 0 0}
.info p{margin:6px 0 22px;color:var(--mut)}
footer{background:var(--nv);color:#e9eef4;padding:50px 0 calc(40px + env(safe-area-inset-bottom,0px));text-align:center}
footer b{font:800 34px 'Bricolage Grotesque',sans-serif;display:block;margin-bottom:6px}
footer a{color:#ffb347}
.ov{position:fixed;inset:0;z-index:50;background:rgba(3,10,20,.7);display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.md{background:var(--card);border-radius:28px 28px 0 0;width:min(520px,100%);max-height:92svh;overflow:auto;padding:26px 22px calc(26px + env(safe-area-inset-bottom,0px))}
@media(min-width:640px){.ov{align-items:center}.md{border-radius:28px}}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mh h2{font-size:34px;margin:0}
.x{background:none;border:0;font-size:30px;line-height:1;cursor:pointer;color:var(--mut)}
.sub{color:var(--mut);margin:6px 0 0}
label{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px}
input,select{width:100%;min-width:0;min-height:50px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;-webkit-appearance:none;appearance:none;text-align:start}
.d2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.est{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:18px 0 12px}
.est b{font:800 36px 'Bricolage Grotesque',sans-serif;color:var(--or)}
.est small{color:var(--mut)}
.er{color:#d6402b;font-size:14px;min-height:22px;margin:0 0 8px}
.row{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.row span:first-child{color:var(--mut)}.row span:last-child{text-align:end}
.lnk{display:block;margin:14px auto 0;background:none;border:0;color:var(--mut);cursor:pointer}
.note{color:var(--mut);font-size:13px;margin:14px 0 18px}
details{border-bottom:1px solid var(--line);padding:18px 0}summary{cursor:pointer;font:800 22px 'Bricolage Grotesque',sans-serif;list-style:none;display:flex;justify-content:space-between;gap:16px}summary::-webkit-details-marker{display:none}summary::after{content:"+";color:var(--or);font-size:28px;line-height:1}details[open] summary::after{content:"–"}details p{color:var(--mut);margin:10px 0 0;max-width:60ch}.faq{max-width:820px}
.fab{position:fixed;z-index:15;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:#1f9a56;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.pt{font:700 14px 'DM Sans',sans-serif;fill:#0f2438;text-anchor:middle}
.info{background:var(--card);border:1px solid var(--line);border-radius:30px;padding:28px}
.open{display:inline-flex;align-items:center;gap:9px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:5px 14px;font-size:14px;margin-bottom:14px}
.open i{width:9px;height:9px;border-radius:50%;background:#1f9a56;box-shadow:0 0 0 4px rgba(31,154,86,.25)}
.rows{margin-top:14px}
.rows li{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.rows li:last-child{border-bottom:0}
.rows em{width:44px;height:44px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-style:normal;flex:none}
.cta{display:grid;gap:12px;margin-top:20px}.cta .btn{display:block;width:100%}
.post{position:relative;border-radius:30px;overflow:hidden;border:6px solid var(--nv);min-height:440px;background:var(--nv)}
.post>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.post::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,36,56,.1) 0%,rgba(15,36,56,.1) 40%,rgba(15,36,56,.92) 100%)}
.stamp{position:absolute;z-index:2;top:16px;right:16px;width:112px;height:112px;transform:rotate(8deg)}
.stamp svg{position:absolute;inset:0;width:100%;height:100%}
.stamp img{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;object-fit:cover;border:2px solid var(--or)}
.pt2{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:26px;color:#fff}
.pt2 h3{font-size:clamp(36px,6vw,54px);margin-top:12px}
.pin{display:inline-flex;align-items:center;gap:10px;background:var(--or);color:#10202f;font-weight:500;border-radius:99px;padding:6px 16px 6px 12px}
.pin i{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid #10202f;animation:r 2s ease-out infinite}
@keyframes r{0%{box-shadow:0 0 0 0 rgba(255,255,255,.8)}100%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}
@media(prefers-reduced-motion:reduce){.pin i{animation:none}}
.mapc{border-radius:30px;overflow-x:auto;overflow-y:hidden;border:6px solid var(--nv);line-height:0;-webkit-overflow-scrolling:touch}.mapc svg{min-width:720px;width:100%;height:auto;display:block}
.pr2{transform-box:fill-box;transform-origin:center;animation:p 2s ease-out infinite}.bn{transform-box:fill-box;transform-origin:50% 100%;animation:b 1.5s ease-in-out infinite}.sh{animation:s 1.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes b{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}@keyframes s{0%,100%{transform:scale(1);opacity:.25}50%{transform:scale(.6);opacity:.12}}@media(prefers-reduced-motion:reduce){.pr2,.bn,.sh{animation:none}}
img{max-width:100%}.hero .w>*,.find>*,.two>*{min-width:0}
</style>
</head>

var L="fr",ref="";
function $(s){return document.querySelector(s)}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function add(s,n){var d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)}
function fmt(s){var p=s.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function rate(n){return n>=4?170:n>=2?200:250}
function calc(){
  var n=Math.round((new Date($("#d2").value)-new Date($("#d1").value))/864e5);if(!(n>0))n=0;
  var ag=$("#zone").value=="ag",r=rate(n),t=n*r+(ag&&n?DEL:0);
  $("#est").textContent=n?t+" DH":"—";
  $("#estd").textContent=n?n+" "+T[L].dy+" × "+r+" DH"+(ag?" + "+DEL+" DH":""):"";
  return {n:n,r:r,t:t};
}
function setLang(l){
  L=l;document.documentElement.lang=l;
  document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=T[l][e.dataset.t]});
  document.querySelectorAll(".lang button").forEach(function(b){b.classList.toggle("on",b.dataset.l==l)});
  calc();try{localStorage.setItem("l",l)}catch(e){}
}
function openM(k){$("#sc").value=k;$("#s1").hidden=false;$("#s2").hidden=true;$("#er").textContent="";$("#ov").classList.add("on");document.body.style.overflow="hidden";calc()}
function closeM(){$("#ov").classList.remove("on");document.body.style.overflow=""}
function summary(){
  var c=calc(),nm=$("#nm").value.trim(),ph=$("#ph").value.trim();
  if(!nm||!ph||!c.n){$("#er").textContent=T[L].er;return}
  ref="BK-"+(1000+Math.floor(Math.random()*9000));
  var z=$("#zone").value,ad=$("#ad").value.trim(),d1=$("#d1").value,d2=$("#d2").value,sc=NAMES[$("#sc").value];
  var rows=[["sr","#"+ref],["fc",sc],["fn",nm+" ("+ph+")"],["pe",fmt(d1)+" → "+fmt(d2)+" ("+c.n+" "+T[L].dy+")"],["fz",T[L]["z"+(z=="tam"?1:z=="ag"?2:3)]+(ad?" – "+ad:"")],["st",c.t+" DH"]];
  var box=$("#sum");box.textContent="";
  rows.forEach(function(r){var row=document.createElement("div");row.className="row";var a=document.createElement("span");a.textContent=T[L][r[0]];var b=document.createElement("span");b.textContent=r[1];row.append(a,b);box.append(row)});
  var m="Bonjour BK MOTO,\nJe souhaite réserver un scooter :\n• Référence : #"+ref+"\n• Scooter : "+sc+"\n• Nom : "+nm+"\n• Téléphone : "+ph+"\n• Période : du "+fmt(d1)+" au "+fmt(d2)+" ("+c.n+" jour(s))\n• Livraison : "+ZFR[z]+(ad?" – "+ad:"")+"\n• Prix estimé : "+c.t+" DH\n\nMerci de me confirmer la disponibilité.";
  $("#wa").href="https://wa.me/"+PH+"?text="+encodeURIComponent(m);
  $("#s1").hidden=true;$("#s2").hidden=false;
}
document.querySelectorAll("[data-img]").forEach(function(e){e.src=IMG[e.dataset.img]});

document.querySelectorAll(".lang button").forEach(function(b){b.onclick=function(){setLang(b.dataset.l)}});
var today=iso(new Date());
$("#d1").min=today;$("#d1").value=today;$("#d2").min=add(today,1);$("#d2").value=add(today,1);

["d2","zone"].forEach(function(i){$("#"+i).onchange=calc});
